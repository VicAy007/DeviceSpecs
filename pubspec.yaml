name: device_specs
description: "Inspecteur d'informations système Android & iOS."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (ViewModels)
  flutter_riverpod: ^3.4.3

  # system_info feature
  device_info_plus: ^13.2.0
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1
  sensors_plus: ^7.1.0

  # profile feature (local persistence of preferences)
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true